services:
  backend:
    build:
      context: ./TamzaBackend
      dockerfile: Dockerfile.backend
    environment:
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    depends_on:
      - backend
    build:
      context: ./TamzaFrontend
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    restart: unless-stopped