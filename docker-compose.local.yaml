services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tamza
      POSTGRES_USER: tamza
      POSTGRES_PASSWORD: tamza_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamza -d tamza"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
